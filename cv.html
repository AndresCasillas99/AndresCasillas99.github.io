<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrés Casillas García de Presno</title>
    <!--for GitHub, Youtube and LinkedIn logos-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
    html { font-size: 16px; } /* PC/tablet default */
    body { font-family: monospace; color: yellow; background: #000000; }

    a { color: yellow; } /* yellow hyperlinks */
    a:visited { color: #e6c200; }
    a:hover, a:focus { color: #fff066; text-decoration: underline; }

    h1 { font-size: 2rem; }    /*means twice the html font-size*/
    h2 { font-size: 1.25rem; }
    p  { font-size: 1rem; }

    @media (max-width: 480px) {
      html { font-size: 16px; } /* larger on phones only -- tablets stay at 16px */
    }

    .content-container {
      max-width: 900px;
      margin: 0 auto;
    }
    .info-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      align-items: baseline;
      border-left: 3px solid #444;
      padding-left: 12px;
    }
    .info-label {
      color: yellow;
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 1px;
      min-width: 160px;
      flex-shrink: 0;
    }
    .info-value {
      color: #fff;
      text-align: left;
    }

    /* Collapsible sections */
    .collapsible-section {
      margin-top: 32px;
    }
    .collapsible-section summary {
      color: yellow;
      font-size: 0.8em;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-bottom: 1px solid #333;
      padding-bottom: 6px;
      cursor: pointer;
      list-style: none; /* removes default browser triangle marker */
    }
    .collapsible-section summary::-webkit-details-marker {
      display: none; /* removes marker in Chrome/Safari */
    }
    .collapsible-section summary::before {
      content: "▶ ";
      display: inline-block;
      transition: transform 0.15s ease;
    }
    .collapsible-section[open] summary::before {
      transform: rotate(90deg);
    }
    .collapsible-section .info-row {
      margin-top: 16px;
    }

    /* CV viewer */
    .cv-frame {
      width: 100%;
      height: 700px;
      border: 1px solid #ccc;
      margin-top: 16px;
      background: #fff;
    }

    .menu-grid {
      list-style: none;
      padding: 8px 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    @media (max-width: 480px) {
      .info-row {
        flex-direction: column;
        gap: 4px;
        align-items: flex-start;
      }
      .info-label {
        min-width: 0;
      }
      .menu-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .cv-frame {
        height: 70vh; /* fits the phone screen */
      }
    }

    @media (max-width: 350px) {
      .menu-grid {
        grid-template-columns: 1fr;
      }
    }
    </style>
</head>
<body>
    <div class="content-container" style="color: #ffffff;">
        <h1>CV</h1>

        <details class="collapsible-section">
          <summary>View CV here</summary>
          <iframe
              class="cv-frame"
              src="./AndresCasillas_CV_Mex_2026.pdf"
              title="CV — Andrés Casillas">
          </iframe>
        </details>

        <details class="collapsible-section">
          <summary>View CV in seperate window</summary>
          <div class="info-row">
            <span class="info-label">📄 PDF</span>
            <span class="info-value">Click <a href="./AndresCasillas_CV_Mex_2026.pdf" target="_blank">here</a> to open my CV in a separate window.</span>
          </div>
        </details>

        <h1>Menu</h1>
        <ul class="menu-grid">
          <li><a href="index.html" style="color: yellow;font-family:monospace;">🏠 Home</a></li>
          <li><a href="cellularautomata.html" style="color: yellow;font-family:monospace;">⚙️ Cellular Automata</a></li>
          <li><a href="books.html" style="color: yellow;font-family:monospace;">📚 Books</a></li>
          <li><a href="cv.html" style="color: yellow;font-family:monospace;">📄 CV</a></li>
          <li><a href="taco.html" style="color: yellow;font-family:monospace;">🌮 Taco</a></li>
          <li><a href="miscellanueos.html" target="_blank" style="color: yellow;font-family:monospace;">🧩 Miscellaneous</a></li>
          <li><a href="index.html#contact" style="color: yellow;font-family:monospace;">✉️ Contact</a></li>
          <li><a href="mexico.html" style="color: yellow;font-family:monospace;">🇲🇽 Mexico</a></li>
        </ul>
    </div>
</body>
</html>
